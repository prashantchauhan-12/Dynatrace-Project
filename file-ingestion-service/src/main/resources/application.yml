# =====================================================
#  FILE INGESTION SERVICE (S1) - Configuration
#  Port: 8081
# =====================================================

server:
  port: 8081

spring:
  application:
    name: file-ingestion-service
  config:
    import: optional:file:../.env.properties
  servlet:
    multipart:
      max-file-size: 10MB        # Max file size allowed
      max-request-size: 10MB

# ---- Dynatrace Configuration ----
# Replace these with your actual Dynatrace tenant details
dynatrace:
  tenant:
    url: https://nfp85520.live.dynatrace.com
  api:
    token: ${DYNATRACE_API_TOKEN}

# ---- Service URLs ----
service:
  transformation:
    url: http://localhost:8082/api/transform
  persistence:
    url: http://localhost:8083/api/persist

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
