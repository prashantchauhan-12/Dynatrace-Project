# =====================================================
#  FILE TRANSFORMATION SERVICE (S2) - Configuration
#  Port: 8082
# =====================================================

server:
  port: 8082

spring:
  application:
    name: file-transformation-service
  config:
    import: optional:file:../.env[.properties]

# ---- Dynatrace Configuration ----
dynatrace:
  tenant:
    url: https://jpf24109.live.dynatrace.com
  api:
    token: ${DYNATRACE_API_TOKEN}

# ---- Service 3 (Persistence) URL ----
service:
  persistence:
    url: http://localhost:8083/api/persist

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
